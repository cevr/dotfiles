# Only baton has a gate; its jobs run when a commit stages files under baton/.
pre-commit:
  parallel: false
  jobs:
    - name: baton lint+fmt
      root: baton/
      glob: "baton/**"
      run: bun run lint:fix && bun run fmt
      stage_fixed: true
    - name: baton typecheck
      root: baton/
      glob: "baton/**"
      run: bun run typecheck
    - name: baton build
      root: baton/
      glob: "baton/**"
      run: bun run build
    - name: baton test
      root: baton/
      glob: "baton/**"
      run: bun run test
