# The Hetzner box's durable run areas, at every boot (provision.sh's storage phase installs it as
# /etc/tmpfiles.d/hetzner-runs.conf, with the user's uid in place of __UID__, and runs it once).
#
# The Bite run's working area: written as /tmp/vperf2 in thousands of places and in its tools, with no
# one setting that names it. /tmp is emptied at each boot (tmp.conf's D line), so /tmp/vperf2 is a link,
# made again after that, to its durable home under /runs (@runs: never cleaned, backed up). No age: the
# daily clean leaves both alone. This file sorts before tmp.conf, so its line for /tmp/vperf2 wins over
# tmp.conf's x line (which is for the exe box, where /tmp/vperf2 is still a directory).
d /runs/vperf2 0755 __UID__ __UID__ -
L /tmp/vperf2  -    -       -       - /runs/vperf2
