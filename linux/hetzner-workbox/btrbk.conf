# btrbk settings for the workbox's nightly backup. backup.sh renders the
# config from this head (@TARGET@ is this month's directory on the Storage Box)
# and one subvolume section for every subvolume under /home/exedev and
# /workspaces: btrbk snapshots a subvolume without the subvolumes nested in it,
# so each warm source and Rift gets its own section.
timestamp_format        long
lockfile                /run/hetzner-backup.lock
snapshot_dir            /var/lib/btrbk/snapshots
snapshot_create         onchange
# Local snapshots: undo for mistakes, and the parents of the next incremental.
snapshot_preserve_min   2d
snapshot_preserve       14d

# The Storage Box is not btrfs and its shell has no pipes or redirects, so the
# send streams go there as files ("raw"), through the sshfs mount backup.sh
# makes. Each month starts a new directory, so its first run is a full backup
# and later runs are incremental against the previous night; backup.sh drops
# directories older than last month (btrbk never deletes raw incrementals).
raw_target_compress       zstd
raw_target_compress_level 3
raw_target_encrypt        openssl_enc
openssl_ciphername        aes-256-cbc
openssl_keyfile           @KEYFILE@
incremental               yes
