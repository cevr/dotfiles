# The Hetzner box's limited subvolumes: the one place their paths and limits are named. storage.sh
# reads it (provision.sh's storage phase, and hetzner-workbox-storage.service at each boot); sync.sh
# reads the cache lines to leave the caches out of the copy. README.md, "Layout", says what each fixes.
#
#   <kind> <path> <limit> <owner> <mode> <qgroup>
#   qgroup <name> <level/id> <limit>
#
# kind: scratch (emptied at boot and aged out: /tmp and the run families' temps), cache (rebuilt by
# its tool: never copied) or durable (run records kept for good: never cleaned, backed up, copied by
# sync.sh runs).
# path: as on the box; ~ is exedev's home. A path that is missing becomes a subvolume (its parents made
# as owner); an empty directory is replaced by one; a directory holding files is left as it is and named
# (storage.sh deletes nothing). The limit is a simple-quota limit on the subvolume's own qgroup: a write
# past it fails with EDQUOT ("Disk quota exceeded") in that subvolume alone. owner: root or user (exedev).
# qgroup: a higher-level group the subvolume joins, whose limit caps the members together.
#
# Disk: two 1.92 TB NVMe in raid1, about 1.7 TiB usable. The limits below take 700 GiB at most (scratch
# 400, /workspaces/.cache 150 through its group, the home's caches 110, /runs 40). They are caps, not
# reservations: with every one of them full, /workspaces and the home still have about 1 TiB, and the
# whole copy from the exe box (home and /workspaces) is about 0.43 TB.

# /tmp: builds write GiBs here, so it is a subvolume on disk, not a tmpfs (a tmpfs takes memory from the
# agents). 2026-11-22 on the exe box, /tmp grew without a bound to 298 GB (/tmp/vperf2, apparent: the Bite run's working area, run records that now go to /runs) and
# 86 GB (/tmp/opencode) and took the workspace disk to 92%. Its cap: 150 GiB, several times a build's.
scratch /tmp                            150G  root  1777  -
# OpenCode's own scratch (its runs' and units' files): 86 GB on 2026-11-22, half of it older than a
# week. Its own subvolume and cap, so it cannot starve the builds' /tmp, nor they it.
scratch /tmp/opencode                   100G  user  0755  -
# The other run families' temps (workbox/slices.conf's families; a caller sets TMPDIR and GOTMPDIR
# to its family's): Go's link and test steps write GiBs to the temp dir, so one family's builds
# cannot fill another's temp, nor /tmp. Each has its own D line in tmp.conf, as /tmp/opencode: emptied
# at boot, aged at 7 days, its subvolume and limit kept. Ergo's: ~60 lanes of Go builds.
scratch /tmp/ergo                       80G   user  0755  -
scratch /tmp/bite-work                  40G   user  0755  -
scratch /tmp/personal                   30G   user  0755  -

# The durable run areas: @runs, its own subvolume mounted at /runs (installimage.conf), outside
# /workspaces, which the backup skips (the owner's ruling) and lanes come and go in. No cleaner touches
# it; backup.sh backs it up with the home. The Bite run's records (in /tmp/vperf2 on the exe box)
# move to /runs/vperf2 (sync.sh runs, at the move), and /tmp/vperf2 becomes a link to it at every boot
# (systemd/tmpfiles.d/hetzner-runs.conf), so the thousands of places that name /tmp/vperf2 keep
# working. OpenCode's run records (its unit folders) belong in /runs/opencode (README.md, Layout).
# 40 GiB, from what is kept (2026-11-23): the Bite run's records, 5 GB planned with room to 10 (of
# 110 GB in /tmp/vperf2, ~89 GB of it rebuildable scratch it cleans itself); OpenCode's unit folders,
# 6 MB of specs, requests and findings and 0.26 GB with their logs (128 on the Mac); the two
# opencode.db copies in /tmp/vperf2 (3.5 GB each) if the owner keeps them. About 18 GB at most, so
# 40 GiB is twice that: a run that writes more hits EDQUOT here, not the disk.
durable /runs                           40G   user  0755  -

# The shared caches. /workspaces/.cache itself is limited, so a cache folder nobody listed (2026-11-23:
# gocache-196w-f1 and gocache-ctx-196w beside the two below) still counts against a cap; the listed ones
# get their own, and all of them together the caches qgroup's.
cache   /workspaces/.cache              60G   user  0755  caches
# Ergo's shared Go build cache, set by Ergo's launcher: grew 85 GB in 7.5 h, bounded only by its trim
# loop. Ergo's floor: an age trim under 75 minutes breaks builds, so the bound is this size; at that
# rate 100 GiB is about 9 hours of growth, and the trim keeps it under. The cap is a backstop, not the
# bound: the pinned Go (workbox/pins.conf) at a full cache (measured 2026-11-23, noble amd64): go build, go test and go test
# -count=1 exit 0 (a cache write that fails is not an error), but go vet exits 1 ("disk quota
# exceeded" on the cache), and a full GOTMPDIR fails go test outright ("creating work dir"). So Ergo's
# size-driven trim keeps the cache at about 80G (oldest-used first, never an entry used in the last 75
# minutes), leaving 20G of headroom: more than an hour of growth at the measured rate.
cache   /workspaces/.cache/ergo-gocache 100G  user  0755  caches
# Turbo's local cache: 4.8 GB on 2026-11-23, trimmed by turbo itself at TURBO_CACHE_MAX_SIZE (20 GB,
# workbox/zshenv); the cap sits above that trim so turbo's own trim acts first.
cache   /workspaces/.cache/turbo        30G   user  0755  caches
# The tools' default caches in the home (no environment change): Go's build and module caches, bun's
# and npm's package stores.
cache   ~/.cache/go-build               40G   user  0755  -
cache   ~/go/pkg/mod                    30G   user  0755  -
cache   ~/.bun/install/cache            30G   user  0755  -
cache   ~/.npm                          10G   user  0755  -

# Everything under /workspaces/.cache together: under the members' sum (190 GiB), so the caches cannot
# all be full at once.
qgroup  caches  1/100  150G
