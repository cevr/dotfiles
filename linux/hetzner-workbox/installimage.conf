## Hetzner installimage config for the workbox on an AX102 (2x 1.92 TB NVMe).
##
## Run from the Rescue System:
##   installimage -a -c installimage.conf -K /root/.ssh/authorized_keys
## then reboot and run layout.sh on the installed system (README.md, RUNBOOK.md).
##
## installimage cannot build a multi-device btrfs ("NOTE: no support btrfs
## multi-device volumes") and SWRAID applies to every partition. So it installs
## onto DRIVE1 alone with SWRAID 0, and layout.sh then copies the partition table
## to the second drive, mirrors /boot/efi, /boot and swap with mdraid1, adds the
## second drive to the btrfs and converts data and metadata to raid1.
##
## Swap is a partition, not a swapfile: btrfs refuses a swapfile on a
## multi-device (raid1) file system.

DRIVE1 /dev/nvme0n1
SWRAID 0
SWRAIDLEVEL 1

BOOTLOADER grub
HOSTNAME bite-cristian
USE_KERNEL_MODE_SETTING no

## The ESP is only used when the server boots UEFI; on a legacy BIOS boot
## installimage warns and leaves it unused. /boot is ext4 so GRUB reads it from
## either half of the mirror.
PART /boot/efi esp   512M
PART /boot     ext4  1G
PART swap      swap  32G
PART btrfs.1   btrfs all

## One btrfs, its top level mounted nowhere. installimage makes @root (the
## first subvolume, id 256) the default; layout.sh adds the mount options.
SUBVOL btrfs.1 @root       /
SUBVOL btrfs.1 @home       /home/exedev
SUBVOL btrfs.1 @tmp        /tmp
SUBVOL btrfs.1 @workspaces /workspaces
## The durable run areas (run records kept for good: never cleaned, backed up; README.md, Layout).
SUBVOL btrfs.1 @runs       /runs

IMAGE /root/.oldroot/nfs/install/../images/Ubuntu-2404-noble-amd64-base.tar.gz
