# Which git worktrees migrate.sh may turn into Rifts. One rule per line:
#
#   hold <name> <reason>   never convert; the worktree is copied as it is
#   release <name>         its owner released it: convert it even with
#                          unpushed commits or stashes (they move into the
#                          warm source as a local branch, nothing is pushed)
#
# <name> is the worktree's directory name, or its path under ~/Developer.
# A worktree with no rule converts when it has no unpushed commits and no
# stashes; uncommitted work always moves with it.

# Ergo removes it itself once batch 18 lands (Saturday ~19:00Z).
hold ergo-batch-18 Ergo batch 18 runs in it until it lands; Ergo removes it
# Not Ergo's: the owner decides (Ergo orchestrator, 2026-11-13).
hold ergo-pinata-tool owner decides
hold ergo-pinata-tool-e7 owner decides
hold bite-pinata-ergo owner decides
hold linear-ergo owner decides

