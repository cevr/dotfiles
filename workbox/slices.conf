# The workbox's CPU and memory shares, and IO accounting, by run family: the one place they are named.
# system-tools.sh's `slices` step (bootstrap.sh on the exe box, provision.sh on the Hetzner box) reads it:
#   <unit> user   <Setting=value>...  a slice of each user's manager, /etc/systemd/user/<unit>
#   <unit> system <Setting=value>...  a drop-in for the system manager's slice
# The settings are systemd.resource-control(5)'s [Slice] settings, written as they are, except a CPU
# cap written as a share of the host's threads (CPUQuota=<n>%threads), which the step turns into a
# percentage of this host's online threads at install (`nproc`).
#
# The families are slices of exedev's own user manager (user@1000.service, lingering), so placing a run
# needs no root: `systemd-run --user --scope --slice=<family>.slice -- <command>` (README.md, Run
# families). The user manager has cpu, io and memory delegated (systemd/slices/), so these settings act.
# They are unit files, not `systemctl set-property --runtime` values, so they survive a reboot (on the
# exe box ergo.slice's runtime values were lost at the 2026-11-23 reboot).
#
# Weights are shares among siblings under load, not caps: the families are siblings inside the user
# manager (default 100 each, app.slice and the rest included). MemoryHigh is a percentage of the
# machine's memory, past which the kernel reclaims from that family and slows it, before the user
# slice's hard cap kills anything.
#
# No IOWeight: on Ubuntu 24.04 NVMe's scheduler is none, which weighs nothing, and io.cost (which would)
# gave 21:1 for 400:20 in one VM measurement and 1:1 in three others, with kernel I/O errors in two runs
# (2026-11-23, the round-2 request): a weight that does nothing is not written here. Fitting io.cost on
# the AX102's own NVMe is a follow-up. Instead each family has IOAccounting, so its io.stat counts the
# bytes it reads and writes (readable by the user, per family).

# The workload budget is user.slice (73%); it includes the normal login and user
# manager trees, and the cron/at/Docker workload child. The protected server is
# a separate system-owned 9% branch. The other 18% is the system reserve.
# OpenCode orchestration/shell work not in a project family (not the server itself).
opencode.slice  user    CPUWeight=400 IOAccounting=yes MemoryMax=7% MemorySwapMax=0
# Ergo's run (~/Developer/personal/ergo and its lanes): the measured heavy one (85 GB of Go cache in
# 7.5 h, its own test fleet). Its gate already runs in ergo-gates.slice (ergo's
# scripts/gate/scope_linux.go), which systemd nests in ergo.slice by its name's dash, so these values
# hold over every gate with no change to Ergo. CPUWeight=20 and a CPU cap of ten of the live box's 16
# threads (CPUQuota=1000%) are the values set there on 2026-11-23 at 03:5xZ, which Ergo has written
# as ~/.config/systemd/user/ergo.slice since. The cap is written as a share of the host's threads
# (62.5%threads: 10 of 16), so it is 1000% on the exe box, as Ergo's file, and 2000% on the AX102's
# 32. Its whole family can use 22% of RAM, regardless of any individual Ergo gate's own budget.
ergo.slice      user    CPUWeight=20 CPUQuota=62.5%threads IOAccounting=yes MemoryMax=22% MemorySwapMax=0
# Bite's runs (~/Developer/work): the paid work, the default share. Named bite-work, not bite, so it is
# not read as the system's bite.slice (the way in); systemd nests it in an implicit user bite.slice at
# the default share. It gets the largest budget, still small enough that the Nov 23 incident's
# 43–47 GB process cannot reach the 64 GB workbox's user-slice cap.
bite-work.slice user    CPUWeight=100 IOAccounting=yes MemoryMax=30% MemorySwapMax=0
# Everything else under ~/Developer/personal: the default share.
personal.slice  user    CPUWeight=100 IOAccounting=yes MemoryMax=7% MemorySwapMax=0
# Agent work's slice, from the guard's removed admission gate (2026-11-26: every command now runs as
# written, and nothing starts a unit here). Twelve of the 16 threads and under half the RAM: kept for a
# run placed here by hand (systemd-run --user --slice=agentwork.slice), never the host.
agentwork.slice user    CPUWeight=20 CPUQuota=75%threads IOAccounting=yes MemoryHigh=40% MemoryMax=45% MemorySwapMax=0 TasksMax=8192
# agentwork.slice's sibling: CPUWeight 1000 and memory floors above 0. The service places itself in app.slice today
# (opencode/mods/update/placement.ts), so these floors cover it only once it places itself here.
opencodecontrol.slice user  CPUWeight=1000 IOAccounting=yes MemoryMin=1G MemoryLow=2G

# The top level. bite.slice (sshd, tailscaled, the resolver) is 1000 in its own unit file. user.slice
# (every agent) and system.slice (MongoDB, Redis, Docker: the databases the runs test against) stay
# equal at the default 100, written here so the split is read in one place.
user.slice      system  CPUWeight=100 MemoryMax=73% MemorySwapMax=0
system.slice    system  CPUWeight=100
