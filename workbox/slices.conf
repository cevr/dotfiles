# The workbox's CPU, IO and memory shares, by run family: the one place they are named.
# system-tools.sh's `slices` step (bootstrap.sh on the exe box, provision.sh on the Hetzner box) reads it:
#   <unit> user   <Setting=value>...  a slice of each user's manager, /etc/systemd/user/<unit>
#   <unit> system <Setting=value>...  a drop-in for the system manager's slice
# The settings are systemd.resource-control(5)'s [Slice] settings, written as they are.
#
# The families are slices of exedev's own user manager (user@1000.service, lingering), so placing a run
# needs no root: `systemd-run --user --scope --slice=<family>.slice -- <command>` (README.md, Run
# families). The user manager has cpu, io and memory delegated (systemd/slices/), so these settings act.
#
# Weights are shares among siblings under load, not caps: the families are siblings inside the user
# manager (default 100 each, app.slice and the rest included). IOWeight acts only where the device's
# scheduler weighs (BFQ or io.cost); MemoryHigh is a percentage of the machine's memory, past which the
# kernel reclaims from that family and slows it, before the user slice's hard cap kills anything.

# The OpenCode server and its plugin host: every agent's turn waits on it, so it wins CPU and IO 4:1
# against a run family. No MemoryHigh: its floor is in systemd/reserve/ (1G/4G).
opencode.slice  user    CPUWeight=400 IOWeight=400
# Ergo's run (~/Developer/personal/ergo and its lanes): the measured heavy one (85 GB of Go cache in
# 7.5 h, its own test fleet). Its gate already runs in ergo-gates.slice (ergo's
# scripts/gate/scope_linux.go), which systemd nests in ergo.slice by its name's dash, so these values
# hold over every gate with no change to Ergo. CPUWeight=20 and CPUQuota=1000% (ten cores at most) are
# the values set on the live box on 2026-11-22, plus its IO share. Memory: Ergo bounds its gates itself
# (ergo-gates.slice's MemoryMax, three quarters of the machine unless set; docs/tooling.md), so the
# family's MemoryHigh sits above that, at 80%, and Ergo's own bound acts first; a lower one would throttle
# a gate inside the budget Ergo gave it.
ergo.slice      user    CPUWeight=20 CPUQuota=1000% IOWeight=20 MemoryHigh=80%
# Bite's runs (~/Developer/work): the paid work, the default share. Named bite-work, not bite, so it is
# not read as the system's bite.slice (the way in); systemd nests it in an implicit user bite.slice at
# the default share, which changes nothing. No memory share: nothing measured asks for one, and the
# user slice's cap stays the bound.
bite-work.slice user    CPUWeight=100 IOWeight=100
# Everything else under ~/Developer/personal: the default share.
personal.slice  user    CPUWeight=100 IOWeight=100

# The top level. bite.slice (sshd, tailscaled, the resolver) is 1000 in its own unit file. user.slice
# (every agent) and system.slice (MongoDB, Redis, Docker: the databases the runs test against) stay
# equal at the default 100, written here so the split is read in one place.
user.slice      system  CPUWeight=100 IOWeight=100
system.slice    system  CPUWeight=100 IOWeight=100
