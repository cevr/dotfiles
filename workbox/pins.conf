# The one place the workbox's pinned system tools are named. system-tools.sh reads it (sourced:
# plain NAME=value lines only); bootstrap.sh and the Hetzner box's provision.sh run that script, and
# workbox/test/system-tools.test.ts fails when a pin below is typed anywhere else in the repository.
# Change a pin here and nowhere else.

# Go, from go.dev: the tarball for GO_ARCH and its sha256 as go.dev/dl/?mode=json publishes it
# (checked 2026-11-22). Only this architecture is pinned: on another the script refuses.
GO_VERSION=1.27.4
GO_ARCH=amd64
GO_SHA256=7226736c2339719cda28fbf3a54d71aa63bcefe376e98cef00034268dab24840

# PowerShell from Microsoft's apt repository (packages.microsoft.com/ubuntu/<VERSION_ID>/prod). Its
# Release file is signed by this key (gpg --verify of noble's InRelease, 2026-11-22); the script
# refuses a downloaded key with any other fingerprint. Microsoft publishes the powershell package
# for amd64 only there (noble: 0 arm64 entries, measured).
MICROSOFT_KEY_URL=https://packages.microsoft.com/keys/microsoft.asc
MICROSOFT_KEY_FINGERPRINT=BC528686B50D79E339D3721CEB3E94ADBE1229CF
PWSH_ARCH=amd64

# From the distribution: the shells the fork's shell tests and the shell scanner know, and the
# user-mode emulators with their binfmt_misc entries (Ergo's arm64 ABI receipts on amd64).
SHELL_PACKAGES="fish ksh mksh"
# The first of these the release has: qemu-user-static through Ubuntu 24.04; from 26.04 it is a
# virtual package that qemu-user-binfmt provides (measured in the 26.04 VM wbtest, 2026-11-22).
QEMU_PACKAGES="qemu-user-static qemu-user-binfmt"
