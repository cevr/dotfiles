# The OpenCode service's memory floor. The service places itself in a transient
# opencode-service-<pid>.scope of the user manager's app.slice (opencode/mods/update/placement.ts, at
# CPUWeight and IOWeight 1000); systemd applies this prefix drop-in to that transient scope (measured
# on systemd 259, 2026-11-22: DropInPaths lists it and memory.low reads it). Under memory pressure the
# kernel reclaims from agent work before this scope's first 4G, and never takes its first 1G: the
# server's RSS is 0.7-0.8 GB at rest and its high-water mark 4.22 GB (notes/perf-many-sessions.md).
# A cgroup's floor holds only as far as each parent's: user.slice, user-.slice, user@.service and
# app.slice carry the same values (the other files under systemd/reserve/).
[Scope]
MemoryMin=1G
MemoryLow=4G
