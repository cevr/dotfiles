# user.slice holds every user's slice and so the OpenCode service's scope: it passes the scope's floor
# down (systemd/reserve/user/opencode-service-.scope.d/30-workbox-reserve.conf says why and the values).
# Its CPU weight stays the default 100; bite.slice, its sibling, has 1000.
[Slice]
MemoryMin=2%
MemoryLow=7%
