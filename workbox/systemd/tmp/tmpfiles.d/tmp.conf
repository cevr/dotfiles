# The workbox's /tmp rules (system-tools.sh tmp installs this as /etc/tmpfiles.d/tmp.conf, which
# replaces the distribution's file of the same name). tmpfiles.d(5):
#   D  emptied at each boot (systemd-tmpfiles-setup --remove), and aged by the daily clean;
#   (an entry of its own, as /tmp/opencode: the /tmp line skips it, at boot and in the daily clean;
#   its own D line empties its contents at boot and keeps the directory, so its subvolume and limit on
#   the Hetzner box stay; where it is missing, it is made as exedev's, OpenCode's user on both boxes);
#   q  as the distribution has /var/tmp.
# The daily clean (systemd-tmpfiles-clean.timer) removes an entry once its access, birth, change and
# modification times are all older than the age; the workbox runs it through workbox-tmp-clean, which
# keeps whatever a running process holds open (that script says how).
#
# 2026-11-22 on the exe box: /tmp held 298 GB in a benchmark's /tmp/vperf2 and 86 GB in /tmp/opencode
# (half of it older than a week) plus thousands of leaked temporary directories. A week covers any run;
# OpenCode's run files get two, as a unit's files can sit idle between its rounds.
D /tmp          1777 root root 7d
D /tmp/opencode 0755 exedev exedev 14d
q /var/tmp      1777 root root 30d
