# The daily clean through workbox-tmp-clean: systemd-tmpfiles --clean, as the stock unit runs it, with
# a BSD lock held on every path under /tmp and /var/tmp a running process has open, which tmpfiles
# skips (workbox/systemd/tmp/workbox-tmp-clean says how).
[Service]
ExecStart=
ExecStart=/usr/local/sbin/workbox-tmp-clean
