# The daily clean through workbox-tmp-clean: systemd-tmpfiles --clean, as the stock unit runs it, with
# BSD locks on the run entries under /tmp and /var/tmp that processes hold (including through
# a file further down the run tree). tmpfiles skips the locked entries and their descendants.
[Service]
ExecStart=
ExecStart=/usr/local/sbin/workbox-tmp-clean
