# Shared Codex config: ~/.codex/config.toml on the laptop and the workbox links here.
# Codex writes through the link (project trust, hook hashes), so expect those edits in git.
# Machine-only settings live in /etc/codex/config.toml (the workbox's Sideshow MCP; see
# workbox/bin/apply-agent-settings). Entries for the other machine's paths are inert.

context_management = { experimental_mode = true }
model = "gpt-6.1-sol"
review_model = "gpt-6.1-sol"
model_reasoning_effort = "high"
sandbox_mode = "danger-full-access"
model_reasoning_summary="detailed"
model_supports_reasoning_summaries=true
personality = "friendly"
approval_policy = "never"
plan_mode_reasoning_effort = "xhigh"

# The Mac Codex app's turn-ended notifier; skips non-Mac hosts and missing installs.
notify = ["/bin/sh", "-c", 'case "$(uname -s)" in Darwin) ;; *) exit 0;; esac; b="$HOME/.codex/computer-use/Codex Computer Use.app/Contents/SharedSupport/SkyComputerUseClient.app/Contents/MacOS/SkyComputerUseClient"; [ -x "$b" ] || exit 0; exec "$b" turn-ended "$1"', "codex-notify"]
service_tier = "default"

[agents]
default_subagent_model = "gpt-6.1-sol"
default_subagent_reasoning_effort = "high"
max_threads = 12

